    <!--
      Apply the theme before first paint so there is no flash of the wrong one.
      Dark is the default — the starfield backdrop is the site's identity — so
      only an explicit choice by the visitor switches to light.
      Must stay inline and blocking.
    -->
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle(
            "dark",
            localStorage.getItem("theme") !== "light"
          );
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
